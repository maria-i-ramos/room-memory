[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "where-did-my-stuff-go"
version = "0.1.0"
description = "Real-video baseline for searchable room objects"
requires-python = ">=3.10"
dependencies = ["opencv-python>=4.8", "numpy>=1.24"]

[project.optional-dependencies]
detection = ["ultralytics>=8.4.178,<9", "timm", "clip @ git+https://github.com/ultralytics/CLIP.git"]
test = ["pytest>=8"]
web = ["Flask>=3.1,<4", "Pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
